<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="liveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF"></stop>
      <stop offset="50%" stop-color="#8A2BE2"></stop>
      <stop offset="100%" stop-color="#FF008C"></stop>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neonGlow)">
    <rect x="20" y="34" width="58" height="42" rx="10" stroke="url(#liveGradient)" stroke-width="5"></rect>

    <path d="M78 46 L108 34 V76 L78 64 Z" stroke="url(#liveGradient)" stroke-width="5" stroke-linejoin="round"></path>

    <circle cx="66" cy="45" r="4" fill="#FF008C"></circle>
  </g>
</svg>