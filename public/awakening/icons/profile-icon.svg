<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="profileGradient" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A8FF"></stop>
      <stop offset="50%" stop-color="#8A2BE2"></stop>
      <stop offset="100%" stop-color="#FF008C"></stop>
    </linearGradient>

    <filter id="profileGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#profileGlow)" stroke="url(#profileGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Center Person -->
    <circle cx="64" cy="42" r="12"></circle>
    <path d="M42 88C42 74 52 66 64 66C76 66 86 74 86 88"></path>

    <!-- Left Person -->
    <circle cx="34" cy="52" r="9"></circle>
    <path d="M20 86C20 76 27 70 34 70C41 70 48 76 48 86"></path>

    <!-- Right Person -->
    <circle cx="94" cy="52" r="9"></circle>
    <path d="M80 86C80 76 87 70 94 70C101 70 108 76 108 86"></path>

  </g>
</svg>