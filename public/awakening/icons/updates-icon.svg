<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="updatesGradient" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A8FF"></stop>
      <stop offset="50%" stop-color="#8A2BE2"></stop>
      <stop offset="100%" stop-color="#FF008C"></stop>
    </linearGradient>

    <filter id="updatesGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#updatesGlow)" stroke="url(#updatesGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Notification Waves -->
    <path d="M26 38C34 28 45 22 58 20"></path>
    <path d="M20 56C30 42 46 34 64 34"></path>
    <path d="M102 38C94 28 83 22 70 20"></path>
    <path d="M108 56C98 42 82 34 64 34"></path>

    <!-- Bell -->
    <path d="
      M64 30
      C48 30 38 42 38 58
      V76
      L30 88
      H98
      L90 76
      V58
      C90 42 80 30 64 30
      Z
    "></path>

    <!-- Bell Clapper -->
    <circle cx="64" cy="98" r="6"></circle>

  </g>
</svg>